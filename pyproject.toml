[project]
name = "gitdx"
version = "0.1.0"
description = "A standalone, standard-library Python Git engine"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gitdx = "gitdx:main"

[project.urls]
Repository = "https://github.com/wispsy/gitdx"
Issues = "https://github.com/wispsy/gitdx/issues"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "scripts/**", "docs/**", "LICENSE", "README.md", "IMPLEMENTATION_PLAN.md"]
